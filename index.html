<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymObserver - Selezione Classi</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 450px; background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border: 1px solid var(--border); text-align: center; }
        h1 { margin-top: 0; color: #312e81; font-size: 1.4rem; margin-bottom: 8px; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
        .class-list { display: flex; flex-direction: column; gap: 12px; }
        .class-btn { display: block; background: var(--primary); color: white; text-decoration: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; font-size: 1rem; transition: background 0.2s, opacity 0.2s; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2); }
        .class-btn:hover { opacity: 0.9; background: #4338ca; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GymObserver</h1>
        <p>Seleziona la classe per aprire la griglia di osservazione:</p>
        
        <div class="class-list">
            <a href="griglia_1g.html" class="class-btn">Classe 1G</a>
            <a href="griglia_2g.html" class="class-btn">Classe 2G</a>
            <a href="griglia_2M.html" class="class-btn">Classe 2M</a>
            <a href="griglia_3M.html" class="class-btn">Classe 3M</a>
            <a href="griglia_4M.html" class="class-btn">Classe 4M</a>
            <a href="griglia_5M.html" class="class-btn">Classe 5M</a>
        </div>
    </div>
</body>
</html>
